<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Brasil em Foco</title>
</head>
<body>
    <header>
        <h1>Brasil em Foco — Cadastro</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Formulário de cadastro</h2>
            <p id="aviso">Formulário demonstrativo: os dados não são enviados nem armazenados.</p>
            <form aria-describedby="aviso">
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <p>
                        <label for="nome">Nome completo (obrigatório)</label><br>
                        <input type="text" id="nome" name="nome" autocomplete="name" required>
                    </p>
                    <p>
                        <label for="email">E-mail (obrigatório)</label><br>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </p>
                    <p>
                        <label for="telefone">Telefone</label><br>
                        <input type="tel" id="telefone" name="telefone" autocomplete="tel">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Áreas de interesse</legend>
                    <p><label><input type="checkbox" name="interesses" value="tecnologia"> Tecnologia</label></p>
                    <p><label><input type="checkbox" name="interesses" value="educacao"> Educação</label></p>
                    <p><label><input type="checkbox" name="interesses" value="meio-ambiente"> Meio ambiente</label></p>
                </fieldset>
                <p>
                    <button type="button" disabled>Cadastrar (indisponível na demonstração)</button>
                    <button type="reset">Limpar formulário</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Brasil em Foco. Projeto desenvolvido para fins educacionais.</p>
    </footer>
</body>
</html>
